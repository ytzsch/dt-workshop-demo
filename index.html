<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;T Workshop Manager Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Workshop job sheet: steel-grey paper, teal accent; red and blue are kept for laser line meaning only */
  --bg:#eceeea; --panel:#ffffff; --panel-2:#f5f6f3; --ink:#1b2226; --muted:#5a656c; --line:#d5dad5;
  --accent:#0d6b63; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --ok:#2c7536; --ok-soft:#e0f0e2; --warn:#8f5400; --warn-soft:#fbeed6; --bad:#b0302a; --bad-soft:#f8e0dd;
  --info:#38566b; --info-soft:#e3ebf1;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13181b; --panel:#1b2226; --panel-2:#212a2e; --ink:#e4e9e6; --muted:#9aa6ab; --line:#313b40;
    --accent:#52b8ab; --accent-ink:#0c1b19; --accent-soft:#1d3835;
    --ok:#73c27f; --ok-soft:#1d3222; --warn:#e3a84f; --warn-soft:#3a2d16; --bad:#ef7d72; --bad-soft:#3c211f;
    --info:#9cc0d8; --info-soft:#1f2d37; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13181b; --panel:#1b2226; --panel-2:#212a2e; --ink:#e4e9e6; --muted:#9aa6ab; --line:#313b40;
  --accent:#52b8ab; --accent-ink:#0c1b19; --accent-soft:#1d3835;
  --ok:#73c27f; --ok-soft:#1d3222; --warn:#e3a84f; --warn-soft:#3a2d16; --bad:#ef7d72; --bad-soft:#3c211f;
  --info:#9cc0d8; --info-soft:#1f2d37; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:26px} h3{font-size:20px}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel-2)}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.who{display:flex;gap:8px;align-items:center;font-size:14px}
select,input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:4px;padding-right:4px}

.guide{max-width:1240px;margin:12px auto 0;padding:0 16px}
.guide-in{background:var(--accent-soft);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px}
.guide-in ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;counter-reset:g}
.guide-in li{counter-increment:g}
.guide-in li::before{content:counter(g);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;margin-right:6px}

main{max-width:1240px;margin:0 auto;padding:16px 16px 60px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;border-bottom:3px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:4px}
.tabs .pv{font-size:11px;color:var(--muted);margin-left:4px;text-transform:uppercase;letter-spacing:.06em}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.plain{background:var(--panel-2);border-color:var(--line);color:var(--muted)}

/* checks */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;align-items:start}
.mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.mk.pass{background:var(--ok-soft);color:var(--ok)}
.mk.warn{background:var(--warn-soft);color:var(--warn)}
.mk.fail{background:var(--bad-soft);color:var(--bad)}
.mk.info{background:var(--info-soft);color:var(--info)}

/* artwork */
.thumb{width:150px;height:96px;border:1px solid var(--line);border-radius:6px;display:block;flex:none;background:var(--panel-2)}
.thumb.big{width:100%;height:220px}
.art path,.art rect,.art circle,.art ellipse,.art line,.art polyline,.art polygon{vector-effect:non-scaling-stroke;stroke-width:1.3px}
.art .sheet-bg{stroke:none}
.sheet-svg{width:100%;height:auto;display:block;border-radius:6px}
.lbl{font:600 9px var(--f-mono);fill:#1b2226;paint-order:stroke;stroke:#ffffffcc;stroke-width:2.5px}
canvas.thumb{background:var(--panel-2)}

/* jobs */
.job{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.job-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.job-title{font-weight:600}
.job .meta{font-size:13px;color:var(--muted)}
@media (max-width:520px){.job{flex-direction:column}.thumb{width:100%;height:140px}}
.steps{display:flex;gap:0;font-size:12px;margin-top:2px;flex-wrap:wrap}
.steps span{padding:2px 10px 2px 0;color:var(--muted);display:flex;align-items:center;gap:5px}
.steps span::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--line)}
.steps span.done{color:var(--ink)}
.steps span.done::before{background:var(--accent);border-color:var(--accent)}
.steps span.now::before{border-color:var(--accent)}
.comment{background:var(--warn-soft);border-left:3px solid var(--warn);padding:8px 10px;border-radius:4px;font-size:14px}

.drop{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:500;display:block}
.stat span{font-size:13px;color:var(--muted)}

.matcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.swatch{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.sheet{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.bar{height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.over{background:var(--bad)}
.preview-note{background:var(--info-soft);color:var(--info);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;margin-bottom:14px}
.preview-note .q{font-weight:600}
.printer{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;gap:12px;background:var(--panel)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.cell-btn{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.copybox{width:100%;height:90px;font:12px var(--f-mono)}
.fineprint{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,.tabs button{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>D&amp;T Workshop Manager</b><span>Demo · Hillside Academy (a made-up school, with made-up pupils)</span></div>
    <div class="seg" role="group" aria-label="Show the app as">
      <button type="button" id="role-pupil" data-role="pupil">Pupil</button>
      <button type="button" id="role-teacher" data-role="teacher">Teacher</button>
      <button type="button" id="role-tech" data-role="tech">Technician</button>
    </div>
    <div class="who" id="who"></div>
    <button type="button" class="btn sm" id="reset">Reset demo</button>
  </div>
</header>
<div class="guide" id="guide">
  <div class="guide-in">
    <strong>Try it:</strong>
    <ol>
      <li>As pupil Finn, send the sample keyring</li>
      <li>As the teacher, approve it</li>
      <li>As the technician, nest the clear acrylic and mark the sheet cut</li>
    </ol>
  </div>
</div>
<main id="main"></main>
<div id="measure" aria-hidden="true" style="position:fixed;left:-20000px;top:0;opacity:0;pointer-events:none"></div>

<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=4; // px per mm while measuring
const LASER={name:'Laser cutter',w:600,h:400};
const PRINTER_BED=[250,210,210];
const GAP=3, MARGIN=5;
const CUT='#ff0000', SCORE='#0000ff', ENGRAVE='#000000';
const TODAY=new Date();
function daysAgo(d,h=10,m=0){const t=new Date(TODAY);t.setDate(t.getDate()-d);t.setHours(h,m,0,0);return t}
function daysAhead(d){const t=new Date(TODAY);t.setDate(t.getDate()+d);return t}
function fmtWhen(d){
  if(!d) return '';
  const day=new Date(d);day.setHours(0,0,0,0);const t=new Date(TODAY);t.setHours(0,0,0,0);
  const diff=Math.round((t-day)/864e5);
  const hm=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(diff===0) return 'Today '+hm;
  if(diff===1) return 'Yesterday '+hm;
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function fmtDate(d){return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):''}
function fmtDur(s){s=Math.max(1,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  if(h) return `${h} h ${m} min`; if(m) return r&&m<10?`${m} min ${r} s`:`${m} min`; return `${r} s`;}
const mm=v=>Math.round(v);
const plural=(n,a,b)=>n===1?a:(b||a+'s');

/* ---------- reference data ---------- */
const MATERIALS={
  ply3:{name:'Birch plywood',t:3,w:600,h:400,cost:4.20,speed:14,colour:'#e8d5ad'},
  mdf3:{name:'MDF',t:3,w:600,h:400,cost:2.10,speed:16,colour:'#c9a57a'},
  acrc3:{name:'Clear acrylic',t:3,w:600,h:400,cost:7.80,speed:9,colour:'#dcebf0'},
  acrb3:{name:'Black acrylic',t:3,w:600,h:400,cost:8.40,speed:9,colour:'#4b4f52'}
};
const CLASSES={'9T2':'Year 9 · 9T2','10T1':'Year 10 · 10T1','11T1':'Year 11 · 11T1 (GCSE)'};
const PROJECTS=[
  {id:'stand',name:'Phone stand',cls:'9T2',kind:'laser',mat:'ply3',due:4},
  {id:'clip',name:'Cable clip',cls:'9T2',kind:'print',due:9},
  {id:'keyring',name:'Acrylic keyring',cls:'10T1',kind:'laser',mat:'acrc3',due:6},
  {id:'nea',name:'NEA prototype, laser parts',cls:'11T1',kind:'laser',mat:'mdf3',due:12},
  {id:'nea3d',name:'NEA prototype, 3D printed parts',cls:'11T1',kind:'print',due:12}
];
const PROJ=Object.fromEntries(PROJECTS.map(p=>[p.id,p]));
const PUPILS=[
  ['Grace Ito','9T2'],['Harvey Lane','9T2'],['Isla Kaur','9T2'],['Jacob Reed','9T2'],['Kezia Ward','9T2'],
  ['Amara Osei','10T1'],['Ben Hollis','10T1'],['Chloe Barker','10T1'],['Dev Patel','10T1'],['Ella Morgan','10T1'],['Finn Doyle','10T1'],
  ['Leo Martins','11T1'],['Maya Singh','11T1'],['Noah Clarke','11T1'],['Olivia Brennan','11T1']
].map(([name,cls])=>({id:name.split(' ')[0].toLowerCase(),name,cls}));
const PUP=Object.fromEntries(PUPILS.map(p=>[p.id,p]));
const MACHINES=[['laser','Laser cutter'],['printer','3D printers'],['bandsaw','Bandsaw'],['drill','Pillar drill']];
const PRINTERS=[{id:'pa',name:'Prusa MK3 · A'},{id:'pb',name:'Prusa MK3 · B'}];

/* ---------- sample artwork (all in mm) ---------- */
function star(cx,cy,r1,r2,n){let d='';for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=-Math.PI/2+i*Math.PI/n;d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(2)+' '+(cy+r*Math.sin(a)).toFixed(2)+' '}return d+'Z'}
function svgDoc(w,h,body){return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}mm" height="${h}mm" viewBox="0 0 ${w} ${h}">${body}</svg>`}
function keyring(w,h,motif){
  const hole=`<circle cx="${(h/2.4).toFixed(2)}" cy="${h/2}" r="2.6" fill="none" stroke="#ff0000" stroke-width="0.1"/>`;
  let m='';
  if(motif==='star') m=`<path d="${star(w*0.62,h/2,h*0.32,h*0.14,5)}" fill="none" stroke="#0000ff" stroke-width="0.1"/>`;
  if(motif==='wave') m=`<path d="M${w*0.3} ${h/2} Q${w*0.38} ${h*0.2} ${w*0.46} ${h/2} T${w*0.62} ${h/2} T${w*0.78} ${h/2} T${w*0.9} ${h/2}" fill="none" stroke="#0000ff" stroke-width="0.1"/>`;
  if(motif==='bolt') m=`<path d="M${w*0.6} ${h*0.15} L${w*0.48} ${h*0.55} L${w*0.6} ${h*0.55} L${w*0.52} ${h*0.88} L${w*0.75} ${h*0.42} L${w*0.62} ${h*0.42} L${w*0.7} ${h*0.15} Z" fill="#000000" stroke="none"/>`;
  return svgDoc(w,h,`<rect x="0.5" y="0.5" width="${w-1}" height="${h-1}" rx="${(h/2.5).toFixed(1)}" fill="none" stroke="#ff0000" stroke-width="0.1"/>${hole}${m}`);
}
function phoneStand(){
  const back=`<path d="M0.5 10 Q0.5 0.5 10 0.5 L70 0.5 Q79.5 0.5 79.5 10 L79.5 109.5 L48 109.5 L48 80 L44.8 80 L44.8 109.5 L0.5 109.5 Z" fill="none" stroke="#ff0000" stroke-width="0.1"/>`;
  const base=`<path d="M86 50.5 L86 0.5 L166 0.5 L166 50.5 L127.6 50.5 L127.6 22 L124.4 22 L124.4 50.5 Z" fill="none" stroke="#ff0000" stroke-width="0.1"/>`;
  const motif=`<path d="${star(40,40,18,8,6)}" fill="none" stroke="#0000ff" stroke-width="0.1"/>`;
  return svgDoc(167,110,back+base+motif);
}
function fingerPanel(x0,w,h,f){
  let d=`M${x0} 0 `;const n=Math.floor(w/f);
  for(let i=0;i<n;i++){const x=x0+i*f;if(i%2){d+=`L${x} 3 L${x+f} 3 `}else{d+=`L${x} 0 L${x+f} 0 `}}
  d+=`L${x0+w} 0 L${x0+w} ${h} `;
  for(let i=n-1;i>=0;i--){const x=x0+i*f;if(i%2){d+=`L${x+f} ${h-3} L${x} ${h-3} `}else{d+=`L${x+f} ${h} L${x} ${h} `}}
  return d+'Z';
}
function boxSides(){
  const p1=fingerPanel(0.5,100,70,10),p2=fingerPanel(106,100,70,10);
  return svgDoc(207,71,`<path d="${p1}" fill="none" stroke="#ff0000" stroke-width="0.1"/><path d="${p2}" fill="none" stroke="#ff0000" stroke-width="0.1"/><circle cx="50.5" cy="35" r="9" fill="none" stroke="#ff0000" stroke-width="0.1"/><path d="M130 20 L182 20 M130 35 L182 35 M130 50 L182 50" fill="none" stroke="#0000ff" stroke-width="0.1"/>`);
}
function plaque(){
  let zz='M18 34 ';for(let i=0;i<10;i++)zz+=`L${24+i*10} ${i%2?34:18} `;
  return svgDoc(141,51,`<rect x="0.5" y="0.5" width="140" height="50" rx="6" fill="none" stroke="#ff0000" stroke-width="0.1"/><circle cx="8" cy="25.5" r="2" fill="none" stroke="#ff0000" stroke-width="0.1"/><circle cx="133" cy="25.5" r="2" fill="none" stroke="#ff0000" stroke-width="0.1"/><path d="${zz}" fill="none" stroke="#0000ff" stroke-width="0.1"/><rect x="118" y="16" width="8" height="8" fill="#000000" stroke="none"/><rect x="118" y="28" width="8" height="8" fill="#000000" stroke="none"/>`);
}
function keyringDXF(w,h){
  const r=h/2-2,b=Math.tan(Math.PI/8);
  const v=[[r,0,0],[w-r,0,b],[w,r,0],[w,h-r,b],[w-r,h,0],[r,h,b],[0,h-r,0],[0,r,b]];
  const lw=(layer,pts,col)=>['0','LWPOLYLINE','8',layer,...(col?['62',col]:[]),'90',pts.length,'70','1',...pts.flatMap(([x,y,bb])=>['10',x.toFixed(3),'20',y.toFixed(3),...(bb?['42',bb.toFixed(6)]:[])])];

      {name:'Ms Price',role:'D&T technician',acc:new Date(2021,2,2)}
    ],
    draft:{project:'keyring',mat:'acrc3',qty:1},
    nest:null,returning:null,feedback:{},progressProject:'keyring',evidencePupil:'leo',classFilter:'all'
  };
}

/* ---------- helpers ---------- */
const STATUS={
  submitted:['Waiting for teacher','info'],returned:['Sent back to fix','warn'],approved:['Approved, in the queue','ok'],
  printing:['Printing now','info'],cut:['Ready to collect','ok'],printed:['Ready to collect','ok'],collected:['Collected','plain']
};
const chip=(t,c='plain')=>`<span class="chip ${c}">${esc(t)}</span>`;
function statusChip(j){const [t,c]=STATUS[j.status];return chip(t,c)}
function checkSummary(checks){
  const f=checks.filter(c=>c.level==='fail').length,w=checks.filter(c=>c.level==='warn').length;
  if(f) return chip(`${f} ${plural(f,'problem')}`,'bad');
  if(w) return chip(`${w} ${plural(w,'warning')}`,'warn');
  return chip('All checks passed','ok');
}
function checkList(checks){
  const mk={pass:'✓',warn:'!',fail:'✕',info:'i'};
  return `<ul class="checks">${checks.map(c=>`<li><span class="mk ${c.level}" aria-hidden="true">${mk[c.level]}</span><span>${esc(c.text)}</span></li>`).join('')}</ul>`;
}
function thumb(j,cls='thumb'){
  if(j.kind==='print') return `<canvas class="${cls}" data-mesh="${j.id}" aria-label="3D model preview"></canvas>`;
  const a=j.art,pad=Math.max(a.bw,a.bh)*0.06;
  const x=a.vbx+(a.bx-pad)/a.s,y=a.vby+(a.by-pad)/a.s,w=(a.bw+2*pad)/a.s,h=(a.bh+2*pad)/a.s;
  return `<svg class="${cls} art" viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="background:${MATERIALS[j.mat].colour}" role="img" aria-label="Design preview">${a.markup}</svg>`;
}
function matLabel(j){return j.kind==='print'?'PLA, Prusa MK3':`${MATERIALS[j.mat].t} mm ${MATERIALS[j.mat].name.toLowerCase()}`}
function inducted(j){return !!state.ind[j.pupil][j.kind==='print'?'printer':'laser']}
function refreshMeshes(){
  document.querySelectorAll('canvas[data-mesh]').forEach(cv=>{
    const id=cv.dataset.mesh;const tris=id==='draft'?state.draft.mesh:(state.jobs.find(j=>j.id===id)||{}).mesh;drawMesh(cv,tris);
  });
}
let toastTimer;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3200)}
function steps(j){
  const order=j.kind==='print'?['submitted','approved','printing','printed','collected']:['submitted','approved','cut','collected'];
  const labels=j.kind==='print'?['Sent','Approved','Printing','Printed','Collected']:['Sent','Approved','Cut','Collected'];
  const at=j.status==='returned'?0:order.indexOf(j.status);
  return `<div class="steps" aria-label="Progress">${labels.map((l,i)=>`<span class="${i<=at?'done':''} ${i===at+1&&j.status!=='returned'?'now':''}">${l}</span>`).join('')}</div>`;
}

/* ---------- pupil ---------- */
function renderPupil(){
  const p=PUP[state.pupil];const d=state.draft;
  const projects=PROJECTS.filter(x=>x.cls===p.cls);
  if(!projects.find(x=>x.id===d.project)){d.project=projects[0].id;d.mat=projects[0].mat||'pla';clearDraftFile()}
  const proj=PROJ[d.project];
  const mine=state.jobs.filter(j=>j.pupil===p.id).sort((a,b)=>b.submitted-a.submitted);
  const res=d.result;
  const fails=res?res.checks.filter(c=>c.level==='fail').length:0;
  const indOk=!!state.ind[p.id][proj.kind==='print'?'printer':'laser'];
  const samples=proj.kind==='laser'
    ?`<button type="button" class="btn sm" data-act="sample" data-s="good">Use the sample keyring</button><button type="button" class="btn sm" data-act="sample" data-s="dxf">Use a sample DXF</button><button type="button" class="btn sm" data-act="sample" data-s="bad">Try a file with mistakes</button>`
    :`<button type="button" class="btn sm" data-act="sample" data-s="clip">Use the sample cable clip</button><button type="button" class="btn sm" data-act="sample" data-s="big">Try a model that's too big</button>`;
  const returning=state.returning?state.jobs.find(j=>j.id===state.returning):null;
  return `
  <div class="grid2">
    <section class="panel" id="send" aria-labelledby="send-h">
      <div class="panel-h"><h2 id="send-h">${returning?'Fix and send again':'Send a job to the workshop'}</h2><span class="muted small">${esc(CLASSES[p.cls])}</span></div>
      ${returning?`<div class="comment" style="margin-bottom:12px"><strong>${esc('Mr Okafor')}:</strong> ${esc(returning.comment)}</div>`:''}
      <div class="stack">
        <div class="fields">
          <div class="field"><label for="f-project">Project</label>
            <select id="f-project" data-chg="project">${projects.map(x=>`<option value="${x.id}" ${x.id===d.project?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
          ${proj.kind==='laser'?`<div class="field"><label for="f-mat">Material</label>
            <select id="f-mat" data-chg="mat">${Object.entries(MATERIALS).map(([k,m])=>`<option value="${k}" ${k===d.mat?'selected':''}>${m.t} mm ${esc(m.name.toLowerCase())}</option>`).join('')}</select></div>`
            :`<div class="field"><label>Printer</label><div style="padding:6px 0">Prusa MK3, PLA</div></div>`}
          <div class="field"><label for="f-qty">Copies</label><input id="f-qty" type="number" min="1" max="30" value="${d.qty}" data-chg="qty"></div>
        </div>
        <p class="small muted">Due ${esc(fmtDate(daysAhead(proj.due)))}. ${proj.kind==='laser'?'Send an SVG or DXF drawn in mm. Red lines cut, blue lines score, black engraves.':'Export as STL in millimetres.'}</p>
        <div class="drop" id="drop">
          <label class="btn primary" for="f-file">Choose your ${proj.kind==='laser'?'.svg or .dxf':'.stl'} file</label>
          <input id="f-file" type="file" accept="${proj.kind==='laser'?'.svg,.dxf,image/svg+xml':'.stl'}" data-chg="file" style="position:absolute;width:1px;height:1px;opacity:0">
          <span class="small muted">or drop it here, or</span>
          <div class="row" style="justify-content:center">${samples}</div>
        </div>
        ${res?`
          <div class="stack">
            <div class="row"><strong>${esc(d.file)}</strong>${res.fatal?'':checkSummary(res.checks)}</div>
            ${!res.fatal&&proj.kind==='laser'?thumb({kind:'laser',art:res.art,mat:d.mat},'thumb big'):''}
            ${!res.fatal&&proj.kind==='print'?`<canvas class="thumb big" data-mesh="draft" aria-label="3D model preview"></canvas>`:''}
            ${checkList(res.checks)}
            ${indOk?'':`<div class="comment">You haven't had your ${proj.kind==='print'?'3D printer':'laser'} safety induction yet. You can still send this, and your teacher will see it.</div>`}
            <div class="row">
              <button type="button" class="btn primary" data-act="submit" ${fails||res.fatal?'disabled':''}>Send to Mr Okafor</button>
              ${fails?`<span class="small" style="color:var(--bad)">Fix the ${plural(fails,'problem')} marked ✕, then choose the file again.</span>`:'<span class="small muted">Warnings are fine to send; your teacher will decide.</span>'}
            </div>
          </div>`:''}
      </div>
    </section>
    <section class="panel" aria-labelledby="mine-h">
      <div class="panel-h"><h2 id="mine-h">My jobs</h2><span class="muted small">${esc(p.name)}</span></div>
      <div class="stack">${mine.length?mine.map(pupilJob).join(''):`<div class="empty">Nothing sent yet. Your jobs and where they've got to will show here.</div>`}</div>
    </section>
  </div>`;
}
function pupilJob(j){
  return `<article class="job">${thumb(j)}<div class="job-body">
    <div class="row"><span class="job-title">${esc(PROJ[j.project].name)}</span>${statusChip(j)}</div>
    <div class="meta">${esc(j.file)} · ${esc(matLabel(j))} · ${j.qty} ${plural(j.qty,'copy','copies')} · sent ${esc(fmtWhen(j.submitted))}</div>
    ${steps(j)}
    ${j.status==='returned'?`<div class="comment"><strong>Mr Okafor:</strong> ${esc(j.comment)}</div><div><button type="button" class="btn sm" data-act="fix" data-id="${j.id}">Fix and send again</button></div>`:''}
    ${j.status==='cut'||j.status==='printed'?`<div class="small" style="color:var(--ok)">Pick it up from the D&amp;T prep room.</div>`:''}
  </div></article>`;
}
function clearDraftFile(){const d=state.draft;delete d.result;delete d.file;delete d.text;delete d.mesh;delete d.names;delete d.pre}
function analyseDraft(){const d=state.draft;const r=analyseSVG(d.text,d.mat,{names:d.names});if(d.pre)r.checks=[...d.pre,...r.checks];d.result=r}
function loadDraftSVG(text,name){const d=state.draft;d.text=text;d.file=name;delete d.names;delete d.pre;analyseDraft();render()}
function loadDraftDXF(text,name){const d=state.draft;d.file=name;const r=dxfToSVG(text);
  if(r.error||r.empty){delete d.text;d.result={fatal:true,checks:[{level:'fail',text:r.error?"This file couldn't be read as a DXF. Save it again as DXF (AutoCAD 2000 or later works best) and try once more.":"The DXF has no 2D shapes in it that the laser can use. Check you exported the right drawing."}]};render();return}
  d.text=r.svg;d.names=r.names;d.pre=r.pre;analyseDraft();render()}
function loadDraftSTL(buf,name){const d=state.draft;d.file=name;const t=readSTL(buf);d.mesh=t;d.result=analyseSTL(t);render()}
function handleFile(f){
  if(!f)return;const kind=PROJ[state.draft.project].kind;
  if(kind==='laser'){if(/\.dxf$/i.test(f.name)){f.text().then(t=>loadDraftDXF(t,f.name));return}
    if(!/\.svg$/i.test(f.name)){toast('Choose an .svg or .dxf file for laser jobs.');return}f.text().then(t=>loadDraftSVG(t,f.name))}
  else{if(!/\.stl$/i.test(f.name)){toast('Choose an .stl file for 3D printing.');return}f.arrayBuffer().then(b=>loadDraftSTL(b,f.name))}
}
function submitDraft(){
  const d=state.draft,p=PUP[state.pupil],proj=PROJ[d.project];
  if(!d.result||d.result.fatal)return;
  const base={pupil:p.id,project:d.project,kind:proj.kind,qty:Math.max(1,Math.min(30,+d.qty||1)),file:d.file,status:'submitted',submitted:new Date(),checks:d.result.checks,cutCount:0};
  if(proj.kind==='laser')Object.assign(base,{mat:d.mat,svg:d.text,est:d.result.est,art:d.result.art});
  else Object.assign(base,{mat:'pla',mesh:d.mesh,stl:d.result.stl});
  if(state.returning){const j=state.jobs.find(x=>x.id===state.returning);Object.assign(j,base);delete j.comment;state.returning=null}
  else state.jobs.push({id:'j'+Date.now(),...base});
  clearDraftFile();d.qty=1;
  toast('Sent. Mr Okafor will check it before it goes in the queue.');render();
}

/* ---------- teacher ---------- */
const QUICK=['Move the keyring hole further from the edge.','Too big for the material, so shrink it a little.','Check your line colours: red cuts, blue scores.','Join up the open cut line.','Looks good, but make one copy first to test it.'];
function renderTeacher(){
  const pending=state.jobs.filter(j=>j.status==='submitted').sort((a,b)=>a.submitted-b.submitted);
  const tabs=[['approvals','Approvals',pending.length],['progress','Class progress'],['evidence','Coursework evidence',null,true]];
  let body='';
  if(state.teacherTab==='approvals'){
    const shown=pending.filter(j=>state.classFilter==='all'||PUP[j.pupil].cls===state.classFilter);
    body=`<div class="panel-h"><h2>Waiting for your approval</h2>
      <div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="f-cls">Class</label><select id="f-cls" data-chg="classFilter"><option value="all">All classes</option>${Object.entries(CLASSES).map(([k,v])=>`<option value="${k}" ${state.classFilter===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div></div>

  if(state.teacherTab==='evidence') body=renderEvidence();

}
function teacherCard(j){
  const p=PUP[j.pupil];const open=state.openReturn===j.id;
  return `<article class="job">${thumb(j)}<div class="job-body">
    <div class="row"><span class="job-title">${esc(p.name)}</span><span class="muted small">${esc(CLASSES[p.cls])}</span>${checkSummary(j.checks)}${inducted(j)?'':chip(j.kind==='print'?'No 3D printer induction':'No laser induction','warn')}</div>
    <div class="meta">${esc(PROJ[j.project].name)} · ${esc(j.file)} · ${esc(matLabel(j))} · ${j.qty} ${plural(j.qty,'copy','copies')} · sent ${esc(fmtWhen(j.submitted))}</div>
    <details><summary class="small">See the checks</summary><div style="margin-top:8px">${checkList(j.checks)}</div></details>

      :`<div class="row"><button type="button" class="btn primary sm" data-act="approve" data-id="${j.id}">Approve</button><button type="button" class="btn sm" data-act="openReturn" data-id="${j.id}">Send back with a comment</button></div>`}
  </div></article>`;
}
function renderProgress(){
  const proj=PROJ[state.progressProject];
  const pupils=PUPILS.filter(p=>p.cls===proj.cls);
  const rows=pupils.map(p=>{
    const js=state.jobs.filter(j=>j.pupil===p.id&&j.project===proj.id).sort((a,b)=>b.submitted-a.submitted);const j=js[0];

  return `<div class="panel">
    <div class="panel-h"><h2>Class progress</h2>
      <div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="f-pp">Project</label><select id="f-pp" data-chg="progressProject">${PROJECTS.map(x=>`<option value="${x.id}" ${x.id===proj.id?'selected':''}>${esc(CLASSES[x.cls].split(' · ')[1])}: ${esc(x.name)}</option>`).join('')}</select></div></div>
    <p class="muted small" style="margin-bottom:10px">Due ${esc(fmtDate(daysAhead(proj.due)))}. ${missing?`<strong style="color:var(--warn)">${missing} ${plural(missing,'pupil hasn\'t','pupils haven\'t')} sent anything yet.</strong>`:'Everyone has sent something.'}</p>

    ${rows.map(({p,j})=>`<tr><td>${esc(p.name)}</td><td>${j?statusChip(j):chip('Not sent yet','warn')}</td><td class="small">${j?esc(fmtWhen(j.submitted)):''}</td><td>${j?checkSummary(j.checks):''}</td>

}
function previewNote(key,q){

/* ---------- technician ---------- */
function renderTech(){
  const pending=state.jobs.filter(j=>j.status==='submitted').length;
  const readyLaser=state.jobs.filter(j=>j.kind==='laser'&&j.status==='approved');
  const lowStock=Object.keys(MATERIALS).filter(k=>state.stock[k]<=state.reorder[k]).length+(state.pla<1000?1:0);
  const tabs=[['queue','Queue',readyLaser.length+state.jobs.filter(j=>j.kind==='print'&&j.status==='approved').length],['materials','Materials',lowStock||null],['safety','Safety register'],['maintenance','Maintenance',null,true],['budgets','Budgets',null,true]];
  let body='';
  if(state.techTab==='queue')body=renderQueue(pending);
  if(state.techTab==='materials')body=renderMaterials();
  if(state.techTab==='safety')body=renderSafety();
  if(state.techTab==='maintenance')body=renderMaintenance();
  if(state.techTab==='budgets')body=renderBudgets();
  return tabBar(tabs,'techTab')+body;
}
function tabBar(tabs,key){
  return `<div class="tabs" role="tablist">${tabs.map(([id,l,c,pv])=>`<button type="button" role="tab" id="tab-${id}" aria-selected="${state[key]===id}" data-act="tab" data-key="${key}" data-tab="${id}">${esc(l)}${c?`<span class="count">${c}</span>`:''}${pv?'<span class="pv">preview</span>':''}</button>`).join('')}</div>`;
}

    ${groups.length?`<div class="cards">${groups.map(g=>{const m=MATERIALS[g.k];const n=g.jobs.reduce((a,j)=>a+j.qty-(j.cutCount||0),0);const t=g.jobs.reduce((a,j)=>a+j.est*(j.qty-(j.cutCount||0)),0);
      const offs=state.offcuts.filter(o=>o.mat===g.k).length;
      return `<div class="matcard"><div class="row"><span class="swatch" style="background:${m.colour}"></span><strong>${m.t} mm ${esc(m.name.toLowerCase())}</strong></div>

        <div class="row">${g.jobs.map(j=>chip(`${PUP[j.pupil].name.split(' ')[0]} ×${j.qty-(j.cutCount||0)}`,j.checks.some(c=>c.level==='warn')?'warn':'plain')).join('')}</div>

  <section class="panel" style="margin-top:16px" aria-labelledby="pq">

    <div class="cards" style="margin-bottom:12px">${PRINTERS.map(pr=>{const j=prints.find(x=>x.status==='printing'&&x.printer===pr.id);
      return `<div class="printer">${j?thumb(j):'<div class="thumb" style="display:grid;place-items:center;color:var(--muted);font-size:13px">Idle</div>'}<div class="job-body"><strong>${esc(pr.name)}</strong>
        ${j?`<div class="small">${esc(PUP[j.pupil].name)} · ${esc(j.file)}</div><div class="small muted">About ${fmtDur(j.stl.hours*3600)}, ${Math.round(j.stl.grams)} g · started ${esc(fmtWhen(j.startedAt))}</div><div><button type="button" class="btn sm primary" data-act="printed" data-id="${j.id}">Print finished</button></div>`
        :'<div class="small muted">Ready for the next job.</div>'}</div></div>`}).join('')}</div>
    ${prints.filter(j=>j.status==='approved').length?`<div class="stack">${prints.filter(j=>j.status==='approved').map(j=>{const free=PRINTERS.filter(pr=>!prints.some(x=>x.status==='printing'&&x.printer===pr.id));
      return `<article class="job">${thumb(j)}<div class="job-body"><div class="row"><span class="job-title">${esc(PUP[j.pupil].name)}</span>${checkSummary(j.checks)}</div>
        <div class="meta">${esc(PROJ[j.project].name)} · ${esc(j.file)} · ${j.stl.dims.map(mm).join(' × ')} mm · about ${fmtDur(j.stl.hours*3600)}</div>
        <div class="row">${free.length?free.map(pr=>`<button type="button" class="btn sm" data-act="startPrint" data-id="${j.id}" data-pr="${pr.id}">Start on ${esc(pr.name.split('· ')[1])}</button>`).join(''):'<span class="small muted">Both printers busy</span>'}</div></div></article>`}).join('')}</div>`
      :`<div class="empty">No approved prints waiting.</div>`}
  </section>
  <section class="panel" style="margin-top:16px" aria-labelledby="rc">
    <div class="panel-h"><h2 id="rc">Ready to collect</h2></div>
    ${ready.length?`<div class="tbl-wrap"><table><thead><tr><th>Pupil</th><th>Job</th><th>Made</th><th></th></tr></thead><tbody>${ready.map(j=>`<tr><td>${esc(PUP[j.pupil].name)}</td><td>${esc(PROJ[j.project].name)} <span class="muted small">×${j.qty}</span></td><td class="small">${esc(fmtWhen(j.cutAt||j.printedAt))}</td><td><button type="button" class="btn sm" data-act="collect" data-id="${j.id}">Collected</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nothing waiting to be picked up.</div>`}
  </section>`;
}
function renderNest(nest){
  const m=MATERIALS[nest.mat];
  if(!nest.sheets.length) return `<div class="empty" style="margin-top:14px">Nothing left to nest in ${esc(m.name.toLowerCase())}.</div>`;
  return `<div class="stack" style="margin-top:16px">
    <div class="row"><h3>Layout for ${m.t} mm ${esc(m.name.toLowerCase())}</h3><span class="small muted">${nest.sheets.length} ${plural(nest.sheets.length,'sheet')}. Offcuts are used first, then full sheets.</span></div>
    ${nest.short?`<div class="comment">Not enough ${esc(m.name.toLowerCase())} in stock: ${nest.left} ${plural(nest.left,'part')} still need a sheet. Order more from the Materials tab.</div>`:''}
    ${nest.unfit?`<div class="comment">${nest.unfit} ${plural(nest.unfit,'part is','parts are')} too big for a full sheet.</div>`:''}
    ${nest.sheets.map((sh,i)=>`<div class="sheet">
      <div class="row" style="justify-content:space-between"><div class="row"><strong>Sheet ${i+1}</strong>${sh.src==='offcut'?chip(`Offcut ${sh.W} × ${sh.H} mm`,'info'):chip(`Full sheet ${sh.W} × ${sh.H} mm`,'plain')}${chip(`${Math.round(sh.util*100)}% used`,sh.util>0.45?'ok':'plain')}</div>
        <span class="small muted">${sh.placed.length} ${plural(sh.placed.length,'part')} · about ${fmtDur(sh.est)}</span></div>
      ${sheetSVG(sh,nest.mat)}
      <div class="small muted">${[...new Set(sh.placed.map(p=>p.it.job))].map(j=>`${esc(PUP[j.pupil].name)} ×${sh.placed.filter(p=>p.it.job===j).length}`).join(' · ')}${sh.left?` · Leaves an offcut of ${sh.left.w} × ${sh.left.h} mm (dashed)`:''}</div>
      <div class="row"><button type="button" class="btn sm" data-act="copySheet" data-i="${i}">Copy SVG for the laser software</button><button type="button" class="btn sm primary" data-act="cutSheet" data-i="${i}">Mark sheet as cut</button></div>
      ${state.copyOpen===i?`<textarea class="copybox" readonly aria-label="Sheet SVG">${esc(sheetSVG(sh,nest.mat,true))}</textarea><p class="fineprint">In the full version this saves an .svg file to open in 2D Design, LightBurn or the laser's own software.</p>`:''}
    </div>`).join('')}
  </div>`;
}
function renderMaterials(){
  const rows=Object.entries(MATERIALS).map(([k,m])=>{const offs=state.offcuts.filter(o=>o.mat===k);const low=state.stock[k]<=state.reorder[k];
    return `<tr><td><div class="row" style="flex-wrap:nowrap"><span class="swatch" style="background:${m.colour}"></span>${m.t} mm ${esc(m.name.toLowerCase())}</div></td>
      <td class="num">${m.w} × ${m.h}</td>
      <td><div class="row" style="flex-wrap:nowrap"><button type="button" class="btn sm" data-act="stock" data-k="${k}" data-d="-1" aria-label="One fewer sheet">−</button><span class="num" style="min-width:2ch;text-align:center">${state.stock[k]}</span><button type="button" class="btn sm" data-act="stock" data-k="${k}" data-d="1" aria-label="One more sheet">+</button></div></td>
      <td class="num">${state.reorder[k]}</td>
      <td>${low?chip('Reorder','bad'):chip('OK','ok')}</td>
      <td><div class="row">${offs.length?offs.map(o=>chip(`${o.w} × ${o.h}`,'plain')).join(''):'<span class="muted small">None</span>'}</div></td>
      <td class="num">£${m.cost.toFixed(2)}</td></tr>`}).join('');
  const order=Object.entries(MATERIALS).filter(([k])=>state.stock[k]<=state.reorder[k]);
  const maxCost=Math.max(...Object.values(state.usage).map(u=>u.cost),1);
  return `<section class="panel"><div class="panel-h"><h2>Sheet stock</h2><span class="small muted">Offcuts are saved automatically when a sheet is cut.</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Material</th><th>Sheet mm</th><th>Sheets</th><th>Reorder at</th><th></th><th>Offcuts (mm)</th><th>Per sheet</th></tr></thead><tbody>${rows}
    <tr><td>PLA filament</td><td class="num">1 kg spools</td><td class="num">${Math.round(state.pla)} g</td><td class="num">1000 g</td><td>${state.pla<1000?chip('Reorder','bad'):chip('OK','ok')}</td><td></td><td class="num">£18.00</td></tr></tbody></table></div></section>
  <div class="grid2" style="margin-top:16px">
    <section class="panel"><div class="panel-h"><h2>To order</h2></div>${order.length||state.pla<1000?`<ul style="margin:0;padding-left:18px">${order.map(([k,m])=>`<li>${m.t} mm ${esc(m.name.toLowerCase())}: ${state.reorder[k]*2-state.stock[k]} sheets (brings it to ${state.reorder[k]*2})</li>`).join('')}${state.pla<1000?'<li>PLA filament: 2 spools</li>':''}</ul>`:'<div class="empty">Nothing to order.</div>'}</section>
    <section class="panel"><div class="panel-h"><h2>Material used this term</h2></div><div class="stack">${Object.entries(state.usage).map(([c,u])=>`<div><div class="row" style="justify-content:space-between"><span>${esc(CLASSES[c])}</span><span class="num small">${(u.area/1e6).toFixed(2)} m² · £${u.cost.toFixed(2)}</span></div><div class="bar"><i style="width:${u.cost/maxCost*100}%"></i></div></div>`).join('')}</div></section>
  </div>`;
}
function renderSafety(){
  const cls=state.safetyClass||'10T1';
  const pupils=PUPILS.filter(p=>p.cls===cls);
  const now=TODAY;
  return `<section class="panel"><div class="panel-h"><h2>Pupil inductions</h2>
      <div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="f-sc">Class</label><select id="f-sc" data-chg="safetyClass">${Object.entries(CLASSES).map(([k,v])=>`<option value="${k}" ${k===cls?'selected':''}>${esc(v)}</option>`).join('')}</select></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Pupil</th>${MACHINES.map(m=>`<th>${esc(m[1])}</th>`).join('')}</tr></thead><tbody>
    ${pupils.map(p=>`<tr><td>${esc(p.name)}</td>${MACHINES.map(([k,l])=>{const d=state.ind[p.id][k];return `<td>${d?`<span class="small">${esc(fmtDate(d))}</span>`:`<button type="button" class="cell-btn" data-act="induct" data-p="${p.id}" data-m="${k}" aria-label="Record ${esc(l)} induction for ${esc(p.name)} today">Not yet · record today</button>`}</td>`}).join('')}</tr>`).join('')}
    </tbody></table></div>
    <p class="fineprint" style="margin-top:8px">Teachers see a warning when a pupil without an induction sends a job.</p></section>
  <section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Staff health and safety training</h2><span class="small muted">D&amp;T Association standards, refresher every 5 years</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Accredited</th><th>Refresher due</th><th></th></tr></thead><tbody>
    ${state.staff.map(s=>{const due=new Date(s.acc);due.setFullYear(due.getFullYear()+5);const days=Math.round((due-now)/864e5);
      return `<tr><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td class="small">${esc(fmtDate(s.acc))}</td><td class="small">${esc(fmtDate(due))}</td><td>${days<0?chip(`Overdue by ${Math.round(-days/30)} months`,'bad'):days<180?chip(`Due in ${Math.max(1,Math.round(days/30))} months`,'warn'):chip('In date','ok')}</td></tr>`}).join('')}
    </tbody></table></div></section>`;
}
function renderMaintenance(){
  const lev=new Date(TODAY);lev.setDate(lev.getDate()+23);
  const cards=[
    {m:'Laser cutter',items:[['Tube hours','1,240 of about 2,000','ok'],['Lens and mirrors cleaned','9 days ago (weekly)','warn'],['Extraction filter','Changed 3 months ago','ok'],['LEV thorough examination','Due '+fmtDate(lev)+' (every 14 months)','warn']]},
    {m:'Prusa MK3 · A',items:[['Print hours','612','ok'],['Nozzle','Replaced 2 months ago','ok'],['Bed sheet','Cleaned today','ok']]},
    {m:'Prusa MK3 · B',items:[['Print hours','588','ok'],['Belt tension','Not checked this term','warn']]},
    {m:'Bandsaw',items:[['Blade','Changed 5 weeks ago','ok'],['Guard check','Weekly, done Monday','ok']]}
  ];
  return previewNote('maintenance','Would reminders like these, worked out from machine hours, be useful?')+`<div class="cards">${cards.map(c=>`<section class="panel"><h3 style="margin-bottom:10px">${esc(c.m)}</h3><div class="stack" style="gap:8px">${c.items.map(([a,b,s])=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:12px"><span>${esc(a)}</span><span class="row" style="flex-wrap:nowrap;gap:6px"><span class="small muted" style="text-align:right">${esc(b)}</span><span class="chip ${s}" aria-label="${s==='ok'?'OK':'Needs attention'}">${s==='ok'?'✓':'!'}</span></span></div>`).join('')}</div></section>`).join('')}</div>`;
}
function renderBudgets(){
  return previewNote('budgets','Do you need to track material spend against a budget per class?')+`<section class="panel"><div class="panel-h"><h2>Material budgets this term</h2><span class="small muted">Worked out from what each class's jobs used</span></div>
    <div class="stack">${Object.entries(state.usage).map(([c,u])=>{const b=state.budget[c];const pc=u.cost/b;return `<div><div class="row" style="justify-content:space-between"><strong>${esc(CLASSES[c])}</strong><span class="num">£${u.cost.toFixed(2)} of £${b}</span></div><div class="bar" style="height:12px"><i class="${pc>0.9?'over':''}" style="width:${Math.min(100,pc*100)}%"></i></div></div>`}).join('')}</div></section>`;
}

/* ---------- actions ---------- */
function stamp(){return new Date()}
const ACT={
  tab:b=>{state[b.dataset.key]=b.dataset.tab;state.copyOpen=null;render()},
  sample:b=>{const s=b.dataset.s;
    if(s==='good')loadDraftSVG(keyring(56,26,'star'),'finn-keyring.svg');
    if(s==='bad')loadDraftSVG(problemFile(),'finn keyring FINAL(2).svg');
    if(s==='dxf')loadDraftDXF(keyringDXF(56,26),'finn-keyring.dxf');
    if(s==='clip')loadDraftSTL(makeBinarySTL(MESH.clip()),'cable-clip.stl');
    if(s==='big')loadDraftSTL(makeBinarySTL(MESH.big()),'desk-tidy-full-size.stl');},
  submit:()=>submitDraft(),
  fix:b=>{const j=state.jobs.find(x=>x.id===b.dataset.id);state.returning=j.id;state.draft.project=j.project;state.draft.mat=j.kind==='laser'?j.mat:'pla';state.draft.qty=j.qty;clearDraftFile();render();$('#send').scrollIntoView({behavior:'smooth',block:'start'})},
  approve:b=>{const j=state.jobs.find(x=>x.id===b.dataset.id);j.status='approved';j.approvedAt=stamp();state.nest=null;toast(`Approved. ${PUP[j.pupil].name.split(' ')[0]}'s job is in the technician's queue.`);render()},
  openReturn:b=>{state.openReturn=b.dataset.id;state.returnText='';render();const t=$('#ret-'+b.dataset.id);t&&t.focus()},
  cancelReturn:()=>{state.openReturn=null;render()},
  quick:b=>{const t=$('#ret-'+b.dataset.id);t.value=(t.value?t.value.trim()+' ':'')+QUICK[+b.dataset.i];state.returnText=t.value;t.focus()},
  return:b=>{const t=$('#ret-'+b.dataset.id);const txt=t.value.trim();if(!txt){toast('Write a short comment so the pupil knows what to change.');t.focus();return}
    const j=state.jobs.find(x=>x.id===b.dataset.id);j.status='returned';j.comment=txt;j.returnedAt=stamp();state.openReturn=null;toast(`Sent back to ${PUP[j.pupil].name.split(' ')[0]}.`);render()},
  nudge:b=>toast(`Reminder shown to ${b.dataset.name} (in this demo nothing is actually sent).`),
  nest:b=>{state.nest=nestBatch(b.dataset.mat);state.copyOpen=null;render()},
  copySheet:b=>{const i=+b.dataset.i;const sh=state.nest.sheets[i];const txt=sheetSVG(sh,state.nest.mat,true);state.copyOpen=i;
    const done=()=>{toast('SVG copied.');render()};
    try{navigator.clipboard.writeText(txt).then(done,()=>render())}catch(e){render()}},
  cutSheet:b=>{
    const i=+b.dataset.i;const nest=state.nest;const sh=nest.sheets[i];const mat=MATERIALS[nest.mat];
    if(sh.src==='offcut')state.offcuts=state.offcuts.filter(o=>o.id!==sh.off);else state.stock[nest.mat]=Math.max(0,state.stock[nest.mat]-1);
    if(sh.left)state.offcuts.push({id:'o'+Date.now()+i,mat:nest.mat,w:sh.left.w,h:sh.left.h});
    const costMm=mat.cost/(mat.w*mat.h);
    sh.placed.forEach(p=>{const j=p.it.job;j.cutCount=(j.cutCount||0)+1;const c=PUP[j.pupil].cls;state.usage[c].area+=p.it.w*p.it.h;state.usage[c].cost+=p.it.w*p.it.h*costMm;
      if(j.cutCount>=j.qty){j.status='cut';j.cutAt=stamp()}});
    nest.sheets.splice(i,1);state.copyOpen=null;
    if(!nest.sheets.length)state.nest=null;
    toast(sh.left?`Marked as cut. Saved an offcut of ${sh.left.w} × ${sh.left.h} mm.`:'Marked as cut. Pupils can see their parts are ready.');render()},
  startPrint:b=>{const j=state.jobs.find(x=>x.id===b.dataset.id);j.status='printing';j.printer=b.dataset.pr;j.startedAt=stamp();render()},
  printed:b=>{const j=state.jobs.find(x=>x.id===b.dataset.id);j.status='printed';j.printedAt=stamp();state.pla=Math.max(0,state.pla-j.stl.grams);render()},
  collect:b=>{const j=state.jobs.find(x=>x.id===b.dataset.id);j.status='collected';render()},
  stock:b=>{state.stock[b.dataset.k]=Math.max(0,state.stock[b.dataset.k]+ +b.dataset.d);render()},
  induct:b=>{state.ind[b.dataset.p][b.dataset.m]=stamp();render()},
  fb:b=>{state.feedback[b.dataset.k]=b.dataset.a;render()}
};
const CHG={
  project:v=>{state.draft.project=v;const p=PROJ[v];state.draft.mat=p.mat||'pla';clearDraftFile()},
  mat:v=>{state.draft.mat=v;if(state.draft.text)analyseDraft()},
  qty:v=>{state.draft.qty=Math.max(1,Math.min(30,+v||1))},
  classFilter:v=>{state.classFilter=v},progressProject:v=>{state.progressProject=v},evidencePupil:v=>{state.evidencePupil=v},safetyClass:v=>{state.safetyClass=v},
  pupil:v=>{state.pupil=v;state.returning=null;clearDraftFile()}
};

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===state.role));
  const who=$('#who');
  if(state.role==='pupil') who.innerHTML=`<label for="f-pupil" class="muted">Signed in as</label><select id="f-pupil" data-chg="pupil">${Object.entries(CLASSES).map(([c,l])=>`<optgroup label="${esc(l)}">${PUPILS.filter(p=>p.cls===c).map(p=>`<option value="${p.id}" ${p.id===state.pupil?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`).join('')}</select>`;
  else who.innerHTML=`<span class="muted">Signed in as</span> <strong>${state.role==='teacher'?'Mr Okafor':'Ms Price'}</strong>`;
  const main=$('#main');
  main.innerHTML=state.role==='pupil'?renderPupil():state.role==='teacher'?renderTeacher():renderTech();
  refreshMeshes();
}
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-role]');if(r){state.role=r.dataset.role;state.copyOpen=null;render();window.scrollTo({top:0});return}
  const b=e.target.closest('[data-act]');if(b&&!b.disabled&&ACT[b.dataset.act]){e.preventDefault();ACT[b.dataset.act](b)}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');if(!el)return;const k=el.dataset.chg;
  if(k==='file'){handleFile(el.files[0]);el.value='';return}
  if(CHG[k]){CHG[k](el.value);render()}
});
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('ret-'))state.returnText=e.target.value});
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.remove('over');handleFile(e.dataTransfer.files[0])});
$('#reset').addEventListener('click',()=>{state=seed();render();toast('Demo reset.')});
window.addEventListener('resize',()=>refreshMeshes());
state=seed();render();
</script>
</body>
</html>
